services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durga_samiti}
      POSTGRES_USER: ${POSTGRES_USER:-durga_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-durga_app} -d ${POSTGRES_DB:-durga_samiti}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-durga_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-durga_samiti}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3000
    depends_on:
      db: {condition: service_healthy}
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
volumes:
  pgdata:
